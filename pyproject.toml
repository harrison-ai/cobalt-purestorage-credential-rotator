[project]
name = "cobalt-purestorage"
description = "Python Package to rotate PureStorage FlashBlade Object Store Credentials"
authors = [
    { name = "Harrison AI", email = "platform@harrison.ai" }
    ]
requires-python = ">=3.13"
# Not used. Releases are tracked by Github releases.
version = "0.0.0"
readme = "README.md"

dependencies = [
    "click>=8.1.3",
    "py-pure-client>=1.29.0",
    "kubernetes>=25.3.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
]

[dependency-groups]
dev = [
    "pytest>=7.2.0",
    "pytest-cov>=4.0.0",
    "ruff>=0.17.4",
]

[tool.uv]
required-version = ">=0.13.0"

[tool.uv.build-backend]
module-root = ""

[build-system]
requires = ["uv_build>=0.13.0,<0.14"]
build-backend = "uv_build"

[project.scripts]
rotate-fb-creds = "cobalt_purestorage.cli:rotate_entrypoint"
smoketest = "cobalt_purestorage.cli:smoketest_entrypoint"

[tool.pytest.ini_options]
testpaths = [
    "tests"
]
addopts = [
    "--log-cli-level=DEBUG",
    "--cov-report",
    "term-missing",
    "--cov=cobalt_purestorage/",
]
filterwarnings = ["ignore::pytest.PytestCacheWarning"]

[tool.coverage.run]
source = ["cobalt_purestorage"]
